# Recipe-bot auto-merge (approved by Ezra): once the full guards run (linen closet exact included) passes
# on the yard-recipe-bot PR, merge it, but only if the PR touches nothing but the recipe store and the
# prompt counts, and only the exact commit guards checked. Direct pushes to main are untouched.
name: recipe-automerge

on:
  workflow_run:
    workflows: [guards]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_branch == 'yard-recipe-bot' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Merge the recipe PR if it only touches the recipe files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr=$(gh pr list -R "$REPO" --head yard-recipe-bot --state open --json number --jq '.[0].number')
          [ -n "$pr" ] || { echo "no open recipe PR"; exit 0; }
          head=$(gh pr view "$pr" -R "$REPO" --json headRefOid --jq .headRefOid)
          [ "$head" = "$SHA" ] || { echo "PR head $head is newer than the checked $SHA; waiting for its guards run"; exit 0; }
          extra=$(gh pr view "$pr" -R "$REPO" --json files --jq '.files[].path' | grep -vxE 'src/lib/yard/(recipes|promptCounts)\.json' || true)
          [ -z "$extra" ] || { echo "PR touches more than the recipe files: $extra"; exit 1; }
          gh pr merge "$pr" -R "$REPO" --squash --delete-branch --match-head-commit "$SHA"
