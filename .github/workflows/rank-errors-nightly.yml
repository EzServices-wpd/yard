# Nightly error ranking — free (GitHub-hosted runner, no xAI, no store writes, no secrets).
# Runs scripts/rank-errors.ts over every build and uploads the dated + latest report as an artifact.
name: rank-errors-nightly

on:
  schedule:
    - cron: "17 7 * * *" # 03:17 ET (07:17 UTC), off the hour to dodge the cron rush
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rank errors (always exits 0)
        run: npx tsx scripts/rank-errors.ts --dir yard-errors
      - name: Date
        id: d
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: yard-errors-ranked-${{ steps.d.outputs.day }}
          path: yard-errors/
          retention-days: 30
          if-no-files-found: error
