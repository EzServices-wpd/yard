# Yard guard suite — runs on every push to main and every pull request.
#
# Typecheck fails this job. The Vercel build runs the same tsc --noEmit before vite, so a missing import cannot deploy.
# A red run means a guard found a regression that is NOT on the skip list.
# The one skip list for known, pre-existing failures lives in scripts/guard-known-failures.ts:
# every entry says why it is tolerated and who owns the fix. Delete an entry when its fix lands
# (the guards print "STALE KNOWN" for entries that no longer fire).
#
# Three parts run in parallel: `checks` (typecheck, guard scripts, linen, .mjs, vite build), `unit`
# (every scripts/*.test.ts and src/lib/yard/*.test.ts, split into 4 shards by run-unit-tests.ts --shard;
# invariants, hunter and the weekend canaries run there once), and `guards`, the one check branch protection
# requires, which is green only when every part is.
name: guards

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A PR's newer push supersedes its older run (each PR has its own ref, so other PRs are never touched).
  # A main push gets a group of its own commit, so no main run is ever cancelled or left pending.
  group: guards-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Honesty smoke
        run: npx tsx scripts/yard-honesty-smoke.ts

      - name: Honesty guards (wine class, fractions, frame check, named table, render stock)
        run: |
          set -o pipefail
          npx tsx scripts/yard-honesty-guards.ts 2>&1 | tee honesty.log

      - name: Wine-class guard
        if: always()
        run: grep -E "^PASS wine" honesty.log

      - name: Fractions guard
        if: always()
        run: grep -E "^PASS fractions" honesty.log

      - name: Frame check (weekend structure families incl. picture frame)
        if: always()
        run: grep -E "WEEKEND STRUCTURE FAMILIES OK" honesty.log

      - name: Named-table guard
        if: always()
        run: grep -E "^PASS named-table" honesty.log

      - name: Render-stock guard
        if: always()
        run: grep -E "^PASS render-stock" honesty.log

      - name: Affiliate guards
        if: always()
        run: npx tsx scripts/yard-affiliate-guards.ts

      - name: Buy order + sheet nest guards
        if: always()
        run: npx tsx scripts/yard-buy-order-guards.ts

      - name: Stand guards
        if: always()
        run: npx tsx scripts/yard-stand-guards.ts

      - name: Climb + Buy-reads-the-model guards (treads, dowel packing, screws from joints)
        if: always()
        run: npx tsx scripts/yard-climb-buy-guards.ts

      - name: Span guards (seats never over their span unless asked open)
        if: always()
        run: npx tsx scripts/yard-span-guards.ts

      - name: Linen closet exact (hard stop)
        run: npx tsx scripts/linen-check.ts

      - name: Learned recipes pass support, cut list vs Buy and wording (blocks recipe-bot auto-merge)
        run: npx tsx scripts/learned-recipe-check.ts

      - name: Unit tests (.mjs)
        if: always()
        run: node --test 'scripts/**/*.test.mjs'

      - name: Build (vite)
        if: always()
        run: node scripts/write-brand-assets.mjs && npx vite build

  unit:
    name: unit (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Includes invariants I1-I14 + eval scoreboard, the I37 hunter (known hits in evals/hunter-baseline.json)
      # and the weekend canaries, which used to run a second time as their own steps.
      - name: Unit tests (TypeScript, via tsx), shard ${{ matrix.shard }}/4
        run: npx tsx scripts/run-unit-tests.ts --shard ${{ matrix.shard }}/4

  # The required check (branch protection asks for "guards"): green only when every job above passed.
  guards:
    needs: [checks, unit]
    # Runs even when a part failed, so the required check reports red instead of "skipped"; a superseded run stays cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every guards job passed
        run: |
          echo 'checks: ${{ needs.checks.result }}  unit: ${{ needs.unit.result }}'
          test '${{ needs.checks.result }}' = success && test '${{ needs.unit.result }}' = success
