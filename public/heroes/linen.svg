<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f0e8"/>
      <stop offset="100%" stop-color="#e8e0d4"/>
    </linearGradient>
    <linearGradient id="ply" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4b896"/>
      <stop offset="50%" stop-color="#c9a87c"/>
      <stop offset="100%" stop-color="#b8956a"/>
    </linearGradient>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- room -->
  <rect width="640" height="480" fill="url(#wall)"/>
  <!-- floor -->
  <rect y="360" width="640" height="120" fill="#d8cfc0"/>
  <!-- alcove recess -->
  <rect x="180" y="40" width="280" height="320" fill="#e0d6c8"/>
  <!-- unit carcase -->
  <g filter="url(#soft)">
    <rect x="200" y="55" width="240" height="300" fill="url(#ply)" stroke="#8a6f4a" stroke-width="1.5"/>
    <!-- shelves -->
    <rect x="208" y="120" width="224" height="8" fill="#a88b62"/>
    <rect x="208" y="190" width="224" height="8" fill="#a88b62"/>
    <rect x="208" y="260" width="224" height="8" fill="#a88b62"/>
    <rect x="208" y="320" width="224" height="8" fill="#a88b62"/>
    <!-- doors open into room -->
    <rect x="200" y="55" width="8" height="300" fill="#9a7b52"/>
    <rect x="432" y="55" width="8" height="300" fill="#9a7b52"/>
    <!-- left door leaf swung -->
    <path d="M208 55 L160 70 L160 340 L208 355 Z" fill="#c9a87c" stroke="#8a6f4a" stroke-width="1"/>
    <!-- right door leaf swung -->
    <path d="M432 55 L480 70 L480 340 L432 355 Z" fill="#c9a87c" stroke="#8a6f4a" stroke-width="1"/>
  </g>
  <!-- dimension callouts -->
  <text x="320" y="30" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#3d3428">31.5″ W × 78″ H × 16″ D</text>
  <text x="320" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#5c5040">Linen closet — alcove fit</text>
  <text x="320" y="442" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8a7d6c">Yard · house path</text>
</svg>
