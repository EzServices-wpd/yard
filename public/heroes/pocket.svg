<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="wall2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f2eee6"/>
      <stop offset="100%" stop-color="#e5ddd0"/>
    </linearGradient>
    <linearGradient id="ply2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4b896"/>
      <stop offset="50%" stop-color="#c9a87c"/>
      <stop offset="100%" stop-color="#b8956a"/>
    </linearGradient>
    <filter id="soft2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="640" height="480" fill="url(#wall2)"/>
  <rect y="360" width="640" height="120" fill="#d4cbb8"/>
  <!-- trapezoid pocket outline (wonky wall) -->
  <path d="M120 80 L200 80 L220 340 L100 340 Z" fill="none" stroke="#b0a090" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- fitted vanity unit -->
  <g filter="url(#soft2)">
    <rect x="160" y="100" width="200" height="240" fill="url(#ply2)" stroke="#8a6f4a" stroke-width="1.5"/>
    <!-- countertop -->
    <rect x="150" y="100" width="220" height="14" fill="#e8dcc8" stroke="#8a6f4a" stroke-width="1"/>
    <!-- drawers -->
    <rect x="170" y="130" width="180" height="50" fill="#c9a87c" stroke="#8a6f4a" stroke-width="1"/>
    <rect x="170" y="190" width="180" height="50" fill="#c9a87c" stroke="#8a6f4a" stroke-width="1"/>
    <rect x="170" y="250" width="180" height="50" fill="#c9a87c" stroke="#8a6f4a" stroke-width="1"/>
    <!-- pulls -->
    <rect x="245" y="148" width="30" height="6" rx="2" fill="#6b5a45"/>
    <rect x="245" y="208" width="30" height="6" rx="2" fill="#6b5a45"/>
    <rect x="245" y="268" width="30" height="6" rx="2" fill="#6b5a45"/>
  </g>
  <text x="320" y="30" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#3d3428">Trapezoid pocket → straight unit</text>
  <text x="320" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#5c5040">Bathroom pocket vanity</text>
  <text x="320" y="442" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8a7d6c">Yard · house path</text>
</svg>
