<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="wall3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4f0e8"/>
      <stop offset="100%" stop-color="#e6dfd2"/>
    </linearGradient>
    <linearGradient id="ply3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4b896"/>
      <stop offset="50%" stop-color="#c9a87c"/>
      <stop offset="100%" stop-color="#b8956a"/>
    </linearGradient>
    <filter id="soft3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="640" height="480" fill="url(#wall3)"/>
  <rect y="360" width="640" height="120" fill="#d6cdb8"/>
  <!-- desk -->
  <g filter="url(#soft3)">
    <!-- top -->
    <rect x="80" y="140" width="480" height="18" fill="#e8dcc8" stroke="#8a6f4a" stroke-width="1.5"/>
    <!-- left pedestal -->
    <rect x="100" y="158" width="140" height="180" fill="url(#ply3)" stroke="#8a6f4a" stroke-width="1"/>
    <rect x="110" y="175" width="120" height="40" fill="#c9a87c" stroke="#8a6f4a" stroke-width="1"/>
    <rect x="110" y="225" width="120" height="40" fill="#c9a87c" stroke="#8a6f4a" stroke-width="1"/>
    <rect x="110" y="275" width="120" height="40" fill="#c9a87c" stroke="#8a6f4a" stroke-width="1"/>
    <!-- right pedestal -->
    <rect x="400" y="158" width="140" height="180" fill="url(#ply3)" stroke="#8a6f4a" stroke-width="1"/>
    <rect x="410" y="175" width="120" height="40" fill="#c9a87c" stroke="#8a6f4a" stroke-width="1"/>
    <rect x="410" y="225" width="120" height="40" fill="#c9a87c" stroke="#8a6f4a" stroke-width="1"/>
    <rect x="410" y="275" width="120" height="40" fill="#c9a87c" stroke="#8a6f4a" stroke-width="1"/>
    <!-- knee space marker -->
    <rect x="250" y="158" width="140" height="180" fill="none" stroke="#a09080" stroke-width="1.5" stroke-dasharray="5 3"/>
  </g>
  <text x="320" y="30" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" fill="#3d3428">60″ W × 30″ D × 29″ H · 24″ knee</text>
  <text x="320" y="420" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#5c5040">Desk with drawers</text>
  <text x="320" y="442" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8a7d6c">Yard · house path</text>
</svg>
